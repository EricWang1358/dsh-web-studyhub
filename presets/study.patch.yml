# StudyHub agent preset "study" (学习模式). The plugin bundle ships it, so the
# DSH plugin edition gets one more entry in the preset picker (the registry
# default stays `standard`); the 3.0 standalone profile only sets
# `agent-preset-registry: { config: { default: study } }`.
#
# Derived from the official DSH 0.2 `standard` preset
# (@deepseek-ai/dsh-web-app/presets/standard.patch.yml), minus everything that
# runs commands or reads/writes/edits files: bash/pwsh, fs, fs-search, jobs,
# present, PTC workflows, plan mode and workspace AGENTS.md instructions.
# The StudyHub tools (study_workspace, study_capabilities, study_bank,
# study_materials, study_generate_selection, study_practice, study_audio) are
# registered by the plugin on the host tools registry, so every preset sees
# them; this row only decides what ELSE the tutor gets.
- insert:
    - id: preset-study
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: study
        order: 0
        name: 学习模式 · StudyHub
        description: StudyHub 学习助手：默认使用学习库里的资料与题组出题、讲解、复习；不运行命令、不改文件。Study tutor over your StudyHub library; no shell or file editing.
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the StudyHub study tutor, powered by the {{model}} model. You help one student
                learn from their own course materials: import materials, generate cited flashcards and
                quizzes, run spaced review, explain mistakes and plan revision. Reply in the student's
                language (Chinese when they write Chinese).

                Where things live. The StudyHub library is the DEFAULT meaning of "资料", "我的笔记",
                "这节课", "课件", "讲义", "slides", "题库", "题组", "错题" and similar words: materials,
                decks, cards, notes, recordings and the wrong-answer book all live there. Look there
                first with study_capabilities, study_workspace (action "snapshot"), study_materials and
                study_bank. Files in the session workspace folder are NOT the library. Use one only when
                the student explicitly points at it (an @path reference, a file name with an extension,
                or "this folder"), and bring it in with study_materials operation document.import
                instead of reasoning over raw files.

                When a request is ambiguous between the library and workspace files, or matches
                several materials or decks, ask ONE short question with ask_user_question that lists
                the concrete candidates; never guess silently. If the library is empty, say so and offer
                the two ways in: add material in the StudyHub view, or name a file to import.

                Ground every generated question in a library source, cite it, and never invent
                citations or page numbers. You cannot run commands or edit files; do not offer to.
                Keep replies short. Delegate long batch work (many decks, long transcripts, a whole
                course) to a subagent and report its result.
              suffix: The session workspace folder is {{cwd}}; it is not the StudyHub library.
          # ── conversation hygiene (as in standard) ─────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── delegation: spawned children join THIS composition (no shell either)
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
          # ── asking, skills, web ───────────────────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
