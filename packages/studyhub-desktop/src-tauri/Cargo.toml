[package]
name = "studyhub-desktop"
version = "5.4.1"
description = "StudyHub Desktop shell (Tauri v2)"
authors = ["ericwang1358"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "studyhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
