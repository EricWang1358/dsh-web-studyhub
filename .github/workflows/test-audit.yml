name: test-audit

# Pull requests and main pushes run the advisory baseline comparison inside .github/workflows/verify.yml
# (warning-only, job summary). Keep this workflow for manual on-demand runs without duplicating PR annotations.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare test audit against docs/test-audit-baseline.json (advisory)
        continue-on-error: true
        run: node scripts/test-audit.mjs --compare-baseline=docs/test-audit-baseline.json --annotations
