name: release-desktop

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing release tag to attach desktop assets to (for example, v4.14.0)'
        required: false
        type: string
      publish_release:
        description: 'Attach built desktop artifacts to the GitHub Release for the tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify desktop (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/studyhub-desktop/src-tauri

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps
        env:
          STUDYHUB_SKIP_PREPARE: '1'

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run desktop boundary, backend, and UI tests
        shell: pwsh
        run: |
          $tests = @(
            "tests/desktop-architecture-boundaries.test.mjs",
            "tests/desktop-backend.test.mjs",
            "tests/desktop-ui.test.mjs",
            "tests/desktop-retrieval.test.mjs",
            "tests/desktop-retrieval-ui.test.mjs",
            "tests/desktop-retrieval-pack.test.mjs"
          ) | Where-Object { Test-Path $_ }
          $desktopTests = Get-ChildItem -Path "packages/studyhub-desktop" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\(node_modules|dist|target)\\' -and
              $_.Name -match '\.test\.(mjs|js)$'
            } |
            ForEach-Object { $_.FullName }
          $tests += $desktopTests
          if ($tests.Count -eq 0) {
            throw "No desktop test files found"
          }
          node --test @tests

      - name: Smoke test isolated staged runtime
        run: node packages/studyhub-desktop/scripts/smoke-staged-runtime.mjs

      - name: Build desktop UI bundle for Tauri context
        shell: pwsh
        run: |
          if (Test-Path "ui/desktop.jsx") {
            npm --prefix packages/studyhub-desktop run build:ui
          } else {
            New-Item -ItemType Directory -Force -Path "packages/studyhub-desktop/dist/ui" | Out-Null
          }

      - name: Check Rust formatting, clippy, and unit tests
        working-directory: packages/studyhub-desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build-release:
    name: build windows installer, portable zip & retrieval bundle
    needs: [verify]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve release version metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:INPUT_TAG }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag != '' && format('refs/tags/{0}', steps.meta.outputs.tag) || github.ref }}

      - name: Verify package version matches release tag
        if: startsWith(steps.meta.outputs.tag, 'v')
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $expected = $env:TAG.TrimStart('v')
          $pkgVersion = (Get-Content -Raw -Path "package.json" | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            throw "package.json version ($pkgVersion) does not match tag version ($expected)"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/studyhub-desktop/src-tauri

      - name: Install root and desktop package dependencies
        run: |
          npm ci --legacy-peer-deps
          npm --prefix packages/studyhub-desktop install
        env:
          STUDYHUB_SKIP_PREPARE: '1'

      - name: Build desktop UI and stage portable Node runtime
        run: |
          npm --prefix packages/studyhub-desktop run build:ui
          npm --prefix packages/studyhub-desktop run stage:runtime

      - name: Build Tauri Windows installers (NSIS + MSI)
        working-directory: packages/studyhub-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build

      - name: Pack portable ZIP, updater manifest, and SHA256SUMS
        run: npm --prefix packages/studyhub-desktop run bundle:zip

      - name: Pack Desktop Retrieval bundle and SHA256SUMS
        run: npm --prefix packages/studyhub-desktop run pack:retrieval -- --verify

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studyhub-desktop-win-x64
          path: packages/studyhub-desktop/dist/release/*
          if-no-files-found: error
          retention-days: 30

      # Attached to a DRAFT release (release.yml makes it, or this step does when it runs first); a draft is not "latest", so the
      # desktop updater never reads a releases/latest/download/latest.json that is not uploaded yet.
      - name: Attach desktop assets to the draft GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem -Path "packages/studyhub-desktop/dist/release" -File |
            Where-Object { $_.Name -match '\.(exe|exe\.sig|msi|zip)$|^latest\.json$|^SHA256SUMS-Desktop-.*\.txt$' }
          $assets = $files | ForEach-Object { $_.FullName }
          $hasSetupExe = $files | Where-Object { $_.Name -match '^StudyHub-Desktop-.*-win-x64-setup\.exe$' }
          $hasSetupSig = $files | Where-Object { $_.Name -match '^StudyHub-Desktop-.*-win-x64-setup\.exe\.sig$' }
          $hasLatestJson = $files | Where-Object { $_.Name -eq 'latest.json' }
          $hasMsi = $files | Where-Object { $_.Name -match '^StudyHub-Desktop-.*-win-x64\.msi$' }
          $hasPortableZip = $files | Where-Object { $_.Name -match '^StudyHub-Desktop-.*-win-x64\.zip$' }
          $hasDesktopSums = $files | Where-Object { $_.Name -match '^SHA256SUMS-Desktop-[0-9].*\.txt$' }
          $hasRetrievalZip = $files | Where-Object { $_.Name -match '^StudyHub-Desktop-Retrieval-.*-win-x64\.zip$' }
          $hasRetrievalSums = $files | Where-Object { $_.Name -match '^SHA256SUMS-Desktop-Retrieval-.*\.txt$' }
          if (-not $hasSetupExe -or -not $hasSetupSig -or -not $hasLatestJson -or -not $hasMsi -or -not $hasPortableZip -or -not $hasDesktopSums -or -not $hasRetrievalZip -or -not $hasRetrievalSums) {
            throw "Expected desktop setup.exe, setup.exe.sig, latest.json, .msi, .zip, retrieval .zip, and SHA256SUMS assets, found $($assets.Count): $($files.Name -join ', ')"
          }
          gh release view $env:TAG -R $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets -R $env:REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
          } else {
            $version = $env:TAG.TrimStart('v')
            # release.yml replaces these notes with the changelog when it uploads the plugin packages.
            gh release create $env:TAG @assets -R $env:REPO --verify-tag --draft --title "StudyHub $version" --notes "StudyHub Desktop $version Windows x64 setup installer (.exe, zero-UAC auto-update), MSI installer (.msi), portable archive (.zip), optional Desktop Retrieval bundle, updater manifest (latest.json), and SHA-256 checksums."
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }

      # Publishes (not a draft, latest) only when release.yml has attached its 11 assets too; otherwise it leaves the draft for that
      # workflow to publish. If this workflow fails the release stays a draft: see docs/release-policy.md for publishing by hand.
      - name: Publish the release once every asset is attached
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/release-publish.mjs --tag $env:TAG --repo $env:REPO
          if ($LASTEXITCODE -ne 0) { throw "release-publish.mjs failed ($LASTEXITCODE)" }
