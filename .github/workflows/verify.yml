name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request or to main replaces an older run still in flight so consecutive merges do not queue serially.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    uses: ./.github/workflows/browser-smoke.yml
  spring:
    uses: ./.github/workflows/spring-platform.yml

  # Lint and the bundle do not depend on the system, so they run once (they used to run on both systems, one after the other with the tests).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject newly introduced low-signal assertions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --depth=1 origin "$BASE_SHA"
          node scripts/test-audit.mjs --gate-from="$BASE_SHA" --annotations
      - run: npm ci --legacy-peer-deps
        env:
          STUDYHUB_SKIP_PREPARE: '1'
      - run: npm --prefix packages/studyhub-tui ci --no-audit --no-fund
      - name: Restore StudyHub TUI dist cache
        uses: actions/cache@v4
        with:
          path: packages/studyhub-tui/dist
          key: tui-dist-${{ runner.os }}-${{ hashFiles('packages/studyhub-tui/src/**', 'packages/studyhub-tui/package.json', 'packages/studyhub-tui/scripts/build.mjs') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --prefix packages/studyhub-tui run lint
      - run: npm --prefix packages/studyhub-tui run typecheck
      - run: npm run build
      - run: npm run tui:build

  # PRs cover every root test on Linux plus platform-specific Windows smoke. Main also runs the full suite on Windows.
  # tests/test-runner-shards.test.mjs checks that the shards below are 1..N for each system.
  test:
    name: test (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 12 }
          - { os: ubuntu-latest, shard: 2, shards: 12 }
          - { os: ubuntu-latest, shard: 3, shards: 12 }
          - { os: ubuntu-latest, shard: 4, shards: 12 }
          - { os: ubuntu-latest, shard: 5, shards: 12 }
          - { os: ubuntu-latest, shard: 6, shards: 12 }
          - { os: ubuntu-latest, shard: 7, shards: 12 }
          - { os: ubuntu-latest, shard: 8, shards: 12 }
          - { os: ubuntu-latest, shard: 9, shards: 12 }
          - { os: ubuntu-latest, shard: 10, shards: 12 }
          - { os: ubuntu-latest, shard: 11, shards: 12 }
          - { os: ubuntu-latest, shard: 12, shards: 12 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lint job builds the bundle. Test shards build isolated bundles on demand.
      - run: npm ci --legacy-peer-deps
        env:
          STUDYHUB_SKIP_PREPARE: '1'
      - uses: ./.github/actions/setup-chromium
      - run: node scripts/test.mjs --shard=${{ matrix.shard }}/${{ matrix.shards }} --test-concurrency=4
        env:
          STUDY_QA_REQUIRE_BROWSER: '1'
      # What this shard measured, to refresh tests/test-weights.json: node scripts/qa/test-weights.mjs --sum --write durations-*/durations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durations-${{ matrix.os }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: node_modules/.cache/studyhub-tests/durations.json
          if-no-files-found: ignore
          retention-days: 14

  test-windows:
    name: test (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shard: 1, shards: 8 }
          - { os: windows-latest, shard: 2, shards: 8 }
          - { os: windows-latest, shard: 3, shards: 8 }
          - { os: windows-latest, shard: 4, shards: 8 }
          - { os: windows-latest, shard: 5, shards: 8 }
          - { os: windows-latest, shard: 6, shards: 8 }
          - { os: windows-latest, shard: 7, shards: 8 }
          - { os: windows-latest, shard: 8, shards: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          STUDYHUB_SKIP_PREPARE: '1'
      - run: node scripts/test.mjs --shard=${{ matrix.shard }}/${{ matrix.shards }} --test-concurrency=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durations-${{ matrix.os }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: node_modules/.cache/studyhub-tests/durations.json
          if-no-files-found: ignore
          retention-days: 14

  # On pull requests, one Windows VM verifies Windows-specific store renames, process/CLI spawning, loopback audio, and test-runner locking/batching.
  windows-smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          STUDYHUB_SKIP_PREPARE: '1'
      - run: >-
          node scripts/test.mjs --test-concurrency=4
          tests/store.test.mjs
          tests/local-command.test.mjs
          tests/live-loopback.test.mjs
          tests/mineru-local.test.mjs
          tests/jev-settings.test.mjs
          tests/wp2-preset.test.mjs
          tests/test-runner-batch.test.mjs
          tests/test-runner-lock.test.mjs
          tests/test-runner-schedule.test.mjs
          tests/test-runner-shards.test.mjs
          tests/test-runner-timeout.test.mjs

  tui-test:
    name: tui-test (ubuntu-latest ${{ matrix.tui_shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tui_shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          STUDYHUB_SKIP_PREPARE: '1'
      - run: npm --prefix packages/studyhub-tui ci --no-audit --no-fund
      - name: Restore StudyHub TUI dist cache
        uses: actions/cache@v4
        with:
          path: packages/studyhub-tui/dist
          key: tui-dist-${{ runner.os }}-${{ hashFiles('packages/studyhub-tui/src/**', 'packages/studyhub-tui/package.json', 'packages/studyhub-tui/scripts/build.mjs') }}
      - run: node packages/studyhub-tui/scripts/run-tests.mjs --shard=${{ matrix.tui_shard }}/3

  tui-windows-smoke:
    name: tui-windows-smoke
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          STUDYHUB_SKIP_PREPARE: '1'
      - run: npm --prefix packages/studyhub-tui ci --no-audit --no-fund
      - name: Restore StudyHub TUI dist cache
        uses: actions/cache@v4
        with:
          path: packages/studyhub-tui/dist
          key: tui-dist-${{ runner.os }}-${{ hashFiles('packages/studyhub-tui/src/**', 'packages/studyhub-tui/package.json', 'packages/studyhub-tui/scripts/build.mjs') }}
      - run: npm run tui:build
      - run: >-
          node packages/studyhub-tui/scripts/run-tests.mjs
          tests/packaging-smoke.test.mjs
          tests/cli-commands.test.mjs
          tests/r2-p2-win-env-shard.test.mjs
          tests/host.test.mjs
          tests/cli-args.test.mjs
          tests/board-store.test.mjs
          tests/round-84-ux.test.mjs
          tests/domain-settings-workspace.test.mjs
          tests/r2-p0-export-batch.test.mjs
          tests/domain-library-decks.test.mjs
          tests/golden-layout-snapshots.test.mjs

  # The one result to look at (and to require, if a branch ever needs a required check): green only when lint and every active test job are green.
  verify:
    if: always()
    needs: [lint, test, test-windows, windows-smoke, tui-test, tui-windows-smoke, browser, spring]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Lint and every test shard passed
        env:
          BROWSER: ${{ needs.browser.result }}
          SPRING: ${{ needs.spring.result }}
          EVENT: ${{ github.event_name }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TEST_WIN: ${{ needs['test-windows'].result }}
          WIN_SMOKE: ${{ needs['windows-smoke'].result }}
          TUI_TEST: ${{ needs['tui-test'].result }}
          TUI_WIN_SMOKE: ${{ needs['tui-windows-smoke'].result }}
        run: |
          echo "lint: $LINT, linux shards: $TEST, windows shards: $TEST_WIN, windows-smoke: $WIN_SMOKE, tui-test: $TUI_TEST, tui-windows-smoke: $TUI_WIN_SMOKE"
          test "$LINT" = success
          test "$TEST" = success
          test "$TUI_TEST" = success
          test "$BROWSER" = success
          test "$SPRING" = success
          if [ "$EVENT" = pull_request ]; then
            test "$WIN_SMOKE" = success
            test "$TUI_WIN_SMOKE" = success
          else
            test "$TEST_WIN" = success
          fi
      - name: Measure workflow wall time, including queueing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt="/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          started=$(gh api "$attempt" --jq 'if .run_attempt == 1 then .created_at else .run_started_at end')
          start=$(date -d "$started" +%s)
          elapsed=$(( $(date +%s) - start ))
          echo "Workflow attempt to verification, including queueing: ${elapsed}s (budget <600s)." >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 600
