name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/test.mjs --test-name-pattern="budget" tests/main-context.test.mjs
      - run: node scripts/test.mjs --test-name-pattern="budget" tests/main-context.test.mjs
      - run: node scripts/test.mjs --test-name-pattern="budget" tests/main-context.test.mjs
